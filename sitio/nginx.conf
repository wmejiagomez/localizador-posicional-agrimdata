# Servidor de la vitrina. Sustituye al default.conf de nginx:alpine, que no manda
# ninguna cabecera de seguridad (medido con curl en producción el 18/09/2026).
#
# **Ojo con `add_header`: no se hereda, se reemplaza.** Por eso aquí no hay
# ningún `location` con cabeceras: todas salen del nivel `server`.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # La vitrina se puede incrustar solo desde el hub y la web principal.
    add_header Content-Security-Policy "frame-ancestors 'self' https://ortofoto.agrimensura.com.do https://herramientas.agrimensura.com.do https://www.agrimensura.com.do" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
